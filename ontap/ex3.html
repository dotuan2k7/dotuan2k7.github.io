<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ex3</title>
</head>
<body>
        <h1> Grades &copy; &reg; &ge;</h1>
<table>
    <tr>
        <th>Subjects</th>
        <th>Grades</th>
    </tr>
    <tr>
        <td>Math</td>
        <td class="score">90</td>
    </tr>
    <tr>
        <td>Science</td>
        <td class="score">85</td> 
    </tr>
    <tr>
        <td>History</td>
        <td class="score">92</td>
    </tr>
    <tr>
        <td>English</td>
        <td class="score">88</td> 
    </tr>
</table>
<br>
<button onclick="calculateAverage()">Calculate Average</button>
<p id="result"></p>
<style>
    table { border-collapse: collapse
        ; width: 300px; }
        th, td { border: 1px solid #ddd; 
            padding: 8px; 
            text-align: center; }
        tr:nth-child(even) { background-color: #f2f2f2; }
</style>
<script>
    function calculateAverage() {
            let scores = document.querySelectorAll(".score");
            let sum = 0;
            
            for (let i = 0; i < scores.length; i++) {
                sum += parseFloat(scores[i].innerText);
            }
            
            let avg = sum / scores.length;
            document.getElementById("result").textContent = "Average Grade: " + avg;
        }
</script>
</body>
</html>
