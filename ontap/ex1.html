<!DOCTYPE html>
<html>
<head>
    <style>
        /* Yêu cầu 3: Style form bằng Flexbox siêu ngắn */
        .my-form { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            width: 300px; 
        }
    </style>
</head>
<body>
    <div class="my-form">
        <input type="text" id="user" placeholder="Username (5-15 ký tự)">
        
        <input type="password" id="pass" placeholder="Password" oninput="checkStrength()">
        <span id="strength">Độ mạnh: </span>

        <input type="file" id="file">
        
        <button onclick="checkForm()">Đăng ký</button>
        <b id="msg"></b> 
    </div>

    <script>
        // Yêu cầu 4: Hàm báo độ mạnh (Chỉ cần xét theo độ dài cho đơn giản)
        function checkStrength() {
            let p = document.getElementById("pass").value;
            let text = document.getElementById("strength");
            
            if (p.length < 5) {
                text.innerText = "Độ mạnh: Yếu";
                text.style.color = "red";
            } else if (p.length < 8) {
                text.innerText = "Độ mạnh: Vừa";
                text.style.color = "orange";
            } else {
                text.innerText = "Độ mạnh: Mạnh";
                text.style.color = "green";
            }
        }

        // Yêu cầu 2: Hàm kiểm tra Form khi bấm nút
        function checkForm() {
            let u = document.getElementById("user").value;
            let p = document.getElementById("pass").value;
            let f = document.getElementById("file").value;
            let msg = document.getElementById("msg");

            // Kính lúp soi xem có chữ và có số không
            let coChu = /[a-zA-Z]/.test(p);
            let coSo = /[0-9]/.test(p);

            // Bắt đầu chuỗi xét duyệt lỗi
            if (u.length < 5 || u.length > 15) {
                msg.innerText = "Lỗi: Username phải từ 5-15 ký tự!";
                msg.style.color = "red";
            } 
            else if (coChu == false || coSo == false) {
                msg.innerText = "Lỗi: Password phải có cả chữ và số!";
                msg.style.color = "red";
            } 
            else if (f.includes(".jpg") == false && f.includes(".png") == false) {
                msg.innerText = "Lỗi: File ảnh phải là .jpg hoặc .png!";
                msg.style.color = "red";
            } 
            else {
                msg.innerText = "Đăng ký thành công!";
                msg.style.color = "green";
            }
        }
    </script>
</body>
</html>
