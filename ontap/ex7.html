<!DOCTYPE html>
<html>
<head>
    <style>
        /* Yêu cầu 3: Tạo viền (border) và khoảng cách (padding, margin) */
        .khung-form {
            border: 2px solid black; 
            padding: 15px; 
            width: 300px;
        }
        .o-nhap {
            width: 100%;
            margin-bottom: 10px; /* Đẩy các ô cách nhau ra 1 chút */
        }
    </style>
</head>
<body>
    <div class="khung-form">
        <label>Họ và Tên:</label>
        <input type="text" id="ten" class="o-nhap">

        <label>Email:</label>
        <input type="email" id="email" class="o-nhap">

        <label>Tin nhắn:</label>
        <textarea id="tin_nhan" class="o-nhap" rows="3"></textarea>

        <button onclick="kiemTraLoi()">Gửi liên hệ</button>
        
        <p id="thong_bao"></p> 
    </div>

    <script>
        // Yêu cầu 4: Hàm kiểm tra ô trống
        function kiemTraLoi() {
            // Bước 1: Gom hết chữ người dùng nhập vào
            let t = document.getElementById("ten").value;
            let e = document.getElementById("email").value;
            let tn = document.getElementById("tin_nhan").value;
            let tb = document.getElementById("thong_bao");

            // Bước 2: Kiểm tra. Dấu == "" nghĩa là Rỗng (không gõ gì cả)
            // Dấu || nghĩa là HOẶC
            if (t == "" || e == "" || tn == "") {
                tb.innerText = "Lỗi: Vui lòng điền kín tất cả các ô!";
                tb.style.color = "red";
            } else {
                tb.innerText = "Thành công: Đã gửi tin nhắn!";
                tb.style.color = "green";
            }
        }
    </script>
</body>
</html>
