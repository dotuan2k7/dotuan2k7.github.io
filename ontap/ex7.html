<!DOCTYPE html>
<html>
<body>
    <form id="contactForm" style="border:1px solid #000; padding:20px; width:250px;">
        <label>Name:</label><input type="text" class="field"><br>
        <label>Email:</label><input type="email" class="field"><br>
        <label>Msg:</label><textarea class="field"></textarea><br>
        <button type="button" onclick="checkForm()">Submit</button>
    </form>
    <script>
        function checkForm() {

    // Lấy tất cả ô có class "field"
    let fields = document.querySelectorAll('.field');

    // Biến kiểm tra xem có ô nào bị trống không
    let empty = false;

    // Duyệt từng ô input
    fields.forEach(function(f) {

        // Nếu ô đang rỗng
        if (f.value === "") {

            // Đánh dấu là có ô trống
            empty = true;
        }
    });

    // Nếu có ô trống
    if (empty) {

        alert("Please fill all fields");

    } else {

        // Nếu nhập đầy đủ
        alert("Success!");
    }
}
    </script>
</body>
</html>
