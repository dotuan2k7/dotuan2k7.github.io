<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>page-content.html</title>
    <style>
        body {
            background-color: #cccccc; /* Màu nền xám nhạt */
            font-family: "Times New Roman", Times, serif; /* Font chữ có chân giống ảnh */
            padding: 40px 50px; /* Tạo khoảng cách lề xung quanh */
            color: #111;
        }

        h2 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .meta {
            font-style: italic; /* Chữ in nghiêng */
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .post-content {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 40px; /* Khoảng cách với bài viết tiếp theo */
        }
    </style>
</head>
<body>

    <h2>Just Another Day</h2>
    <p class="meta">Written by Christina on January 11th</p>
    <p class="post-content">This is my second blog entry, and I just wanted to check in on you</p>

    <h2>My First Blog Entry</h2>
    <p class="meta">Written by Christina on January 10th</p>
    <p class="post-content">I'm so happy to write my first blog entry – yay!</p>

</body>
</html>
